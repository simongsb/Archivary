name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Archivary.slnx

      - name: Build (Domain/Application/Infrastructure/Api)
        run: >
          dotnet build Archivary.slnx
          --no-restore
          --configuration Release

      - name: Test
        run: >
          dotnet test Archivary.slnx
          --no-build
          --configuration Release
